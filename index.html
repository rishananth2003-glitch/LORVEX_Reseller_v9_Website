<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>LORVEX Reseller</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e5e7eb;--brand:#ff6b00;--brand2:#ff9a3d;--nav:#07111f;--success:#12b76a;--danger:#f04438;--shadow:0 18px 45px rgba(16,24,40,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(255,107,0,.22),transparent 35%),linear-gradient(135deg,#07111f,#111d31)}
.auth-card{width:min(440px,100%);background:rgba(255,255,255,.98);border-radius:28px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:900;font-size:20px}.brand h1{font-size:25px;margin:0}.brand small{color:var(--muted)}
.auth-card h2{margin:0 0 7px;font-size:28px}.muted{color:var(--muted)}.login-note{font-size:13px;line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;background:#fff}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,107,0,.1)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--brand);color:#fff}.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.6;cursor:not-allowed}.btn.secondary{background:#eef2f6;color:var(--ink)}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}.btn.sm{padding:8px 11px;font-size:12px}.full{width:100%}.error{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0;white-space:pre-wrap}
.topbar{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.96);backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}.topbar-inner{max-width:1280px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.topbrand{display:flex;align-items:center;gap:10px}.topbrand .logo{width:38px;height:38px;border-radius:11px;font-size:16px}.topbrand b{display:block}.topbrand span{font-size:11px;color:#aeb9c8}.user-area{display:flex;align-items:center;gap:10px}.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:rgba(255,107,0,.16);color:#ffb06f;font-size:11px;font-weight:900}
.container{max-width:1280px;margin:auto;padding:24px 20px 50px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{border:1px solid var(--line);background:#fff;color:#344054;border-radius:12px;padding:10px 14px;font-weight:800}.tab.active{background:var(--nav);border-color:var(--nav);color:#fff}.panel{background:var(--card);border:1px solid #edf0f3;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.panel h2{margin:0;font-size:22px}.panel h3{margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #edf0f3;border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat b{display:block;font-size:25px;margin-top:8px}.stat .accent{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.info-card{border:1px solid var(--line);border-radius:16px;padding:17px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:13px 12px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap;font-size:13px}th{background:#f8fafc;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}.empty{padding:30px;text-align:center;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:800}.pill.success{background:#ecfdf3;color:#027a48}.pill.warn{background:#fffaeb;color:#b54708}.pill.danger{background:#fef3f2;color:#b42318}.notice{padding:12px 14px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px;margin-bottom:15px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:18px}.modal-box{position:relative;width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:25px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#f2f4f7;color:#344054;font-size:22px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#101828;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);max-width:340px}.small{font-size:12px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.container{padding:16px 12px 35px}.topbar-inner{padding:12px}.user-area .name{display:none}}
@media(max-width:520px){.auth-card{padding:24px;border-radius:22px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat b{font-size:20px}.panel{padding:15px;border-radius:17px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.tab{white-space:nowrap}.topbrand b{font-size:14px}}
</style>
</head>
<body>
<section id="loginView" class="auth"><div class="auth-card">
<div class="brand"><div class="logo">L</div><div><h1>LORVEX Reseller</h1><small>Reseller management portal</small></div></div>
<h2>Welcome back</h2><p class="muted">Sign in to manage products, orders and reseller accounts.</p>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn full" type="submit">Sign in</button><p id="loginError" class="error"></p></form>
<p class="login-note muted">Your password is handled by Firebase Authentication and is not stored in Firestore.</p>
</div></section>
<section id="dashboardView" class="hidden"><header class="topbar"><div class="topbar-inner"><div class="topbrand"><div class="logo">L</div><div><b>LORVEX Reseller</b><span>Secure order management</span></div></div><div class="user-area"><span id="roleBadge" class="badge"></span><span id="userName" class="name small"></span><button id="logoutBtn" class="btn secondary sm">Logout</button></div></div></header>
<main class="container"><div id="adminNav" class="tabs hidden"><button class="tab" data-tab="overview">Overview</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="resellers">Resellers</button></div><div id="resellerNav" class="tabs hidden"><button class="tab" data-tab="myOverview">Dashboard</button><button class="tab" data-tab="myOrders">My Orders</button></div>
<section id="overview" class="panel"></section><section id="orders" class="panel hidden"></section><section id="products" class="panel hidden"></section><section id="resellers" class="panel hidden"></section><section id="myOverview" class="panel hidden"></section><section id="myOrders" class="panel hidden"></section></main></section>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="x" id="closeModalBtn">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCKGN6roW_vqyTncmR55n8OLp2hzzZtv1U",authDomain:"lorvex-reseller.firebaseapp.com",projectId:"lorvex-reseller",storageBucket:"lorvex-reseller.firebasestorage.app",messagingSenderId:"800479768463",appId:"1:800479768463:web:58db23b6eb36c8c8bbe5fa",measurementId:"G-RKNWPRY2SJ"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const secondaryApp=firebase.initializeApp(firebaseConfig,"secondary"),secondaryAuth=secondaryApp.auth();
let me=null,profile=null,products=[],orders=[],resellers=[];const $=id=>document.getElementById(id);
const money=n=>"Rs. "+Number(n||0).toLocaleString("en-LK",{minimumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const statusClass=s=>s==="Delivered"?"success":s==="Cancelled"?"danger":s==="Pending"?"warn":"";
function showError(msg){$("loginError").textContent=msg||""}function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function openModal(html){$("modalContent").innerHTML=html;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}window.closeModal=closeModal;
function friendly(e){const m={"auth/invalid-credential":"Incorrect email or password.","auth/user-not-found":"This email is not registered in Firebase Authentication.","auth/wrong-password":"Incorrect password.","auth/invalid-email":"Invalid email address.","auth/user-disabled":"This Firebase account is disabled.","auth/too-many-requests":"Too many attempts. Please wait a few minutes.","auth/network-request-failed":"Network error. Check your internet connection."};return (m[e.code]||e.message||"Login failed")+(e.code?" ["+e.code+"]":"")}
$("closeModalBtn").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();showError("Checking Firebase login…");const b=$("loginBtn");b.disabled=true;b.textContent="Signing in…";try{const cred=await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);me=cred.user;const s=await db.collection("users").doc(me.uid).get();if(!s.exists){await auth.signOut();throw new Error("Firebase login succeeded, but Firestore profile users/"+me.uid+" does not exist. Create the profile first.")}const d=s.data()||{};profile={uid:me.uid,...d,email:d.email||d.Email||me.email,name:d.name||d.Name||me.email,role:String(d.role||d.Role||"reseller").toLowerCase(),status:String(d.status||d.Status||"active").toLowerCase()};if(profile.status==="inactive"||d.active===false){await auth.signOut();throw new Error("This user account is inactive.")}if(!["admin","reseller"].includes(profile.role)){await auth.signOut();throw new Error("Firestore profile role is missing. Set role to admin or reseller.")}await enterDashboard()}catch(err){console.error(err);showError(friendly(err))}finally{b.disabled=false;b.textContent="Sign in"}});
$("logoutBtn").onclick=()=>auth.signOut();
$("loginForm").insertAdjacentHTML("beforeend",'<button type="button" id="resetBtn" style="margin-top:8px;width:100%;border:0;background:none;color:#667085;text-decoration:underline">Forgot password?</button>');
$("resetBtn").onclick=async()=>{const email=$("email").value.trim();if(!email){showError("Enter your Firebase Authentication email first.");return}try{await auth.sendPasswordResetEmail(email);showError("Password reset email sent. Check your inbox/spam.")}catch(e){showError(friendly(e))}};
async function enterDashboard(){$("loginView").classList.add("hidden");$("dashboardView").classList.remove("hidden");$("userName").textContent=profile.name;$("roleBadge").textContent=profile.role.toUpperCase();if(profile.role==="admin"){await loadAdmin();showTab("overview")}else{await loadReseller();showTab("myOverview")}}
auth.onAuthStateChanged(async u=>{if(!u){me=null;profile=null;$("loginView").classList.remove("hidden");$("dashboardView").classList.add("hidden");$("adminNav").classList.add("hidden");$("resellerNav").classList.add("hidden");return}try{if(profile&&profile.uid===u.uid)return;me=u;const s=await db.collection("users").doc(u.uid).get();if(!s.exists){await auth.signOut();showError("Firebase login works, but this account has no Firestore users profile.");return}const d=s.data()||{};profile={uid:u.uid,...d,email:d.email||d.Email||u.email,name:d.name||d.Name||u.email,role:String(d.role||d.Role||"reseller").toLowerCase(),status:String(d.status||d.Status||"active").toLowerCase()};if(profile.status==="inactive"||d.active===false)throw new Error("This user account is inactive.");if(!["admin","reseller"].includes(profile.role))throw new Error("Set the Firestore profile role to admin or reseller.");await enterDashboard()}catch(err){console.error(err);await auth.signOut();showError(err.message||"Profile loading failed.")}});
function showTab(tab){document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));$(tab)?.classList.remove("hidden");document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab))}
document.querySelectorAll(".tabs").forEach(t=>t.addEventListener("click",e=>{if(e.target.dataset.tab)showTab(e.target.dataset.tab)}));
async function getAll(n){const s=await db.collection(n).get();return s.docs.map(d=>({id:d.id,...d.data()}))}async function getBy(n,f,v){const s=await db.collection(n).where(f,"==",v).get();return s.docs.map(d=>({id:d.id,...d.data()}))}
async function loadAdmin(){[products,resellers,orders]=await Promise.all([getAll("products"),getAll("users"),getAll("orders")]);resellers=resellers.filter(x=>String(x.role||x.Role||"").toLowerCase()==="reseller");$("adminNav").classList.remove("hidden");$("resellerNav").classList.add("hidden");renderOverview();renderOrders();renderProducts();renderResellers()}
async function loadReseller(){orders=await getBy("orders","resellerId",profile.uid);products=await getAll("products");$("resellerNav").classList.remove("hidden");$("adminNav").classList.add("hidden");renderMyOverview();renderMyOrders()}
function renderOverview(){const delivered=orders.filter(o=>o.status==="Delivered"),sales=orders.reduce((a,o)=>a+Number(o.total||0),0),commission=delivered.reduce((a,o)=>a+Number(o.commission||0),0);$("overview").innerHTML=`<div class="panel-head"><div><h2>Admin Dashboard</h2><p class="muted">Manage LORVEX products, orders and resellers.</p></div><span class="pill success">System online</span></div><div class="stats"><div class="stat"><span class="label">TOTAL ORDERS</span><b>${orders.length}</b></div><div class="stat"><span class="label">DELIVERED</span><b>${delivered.length}</b></div><div class="stat"><span class="label">RESELLERS</span><b>${resellers.length}</b></div><div class="stat"><span class="label">TOTAL SALES</span><b class="accent">${money(sales)}</b></div></div><div class="grid"><div class="info-card"><h3>Commission payable</h3><b>${money(commission)}</b><p class="muted small">Delivered orders only.</p></div><div class="info-card"><h3>Quick actions</h3><div class="actions"><button class="btn sm" onclick="showTab('products')">Manage products</button><button class="btn sm secondary" onclick="showTab('resellers')">Manage resellers</button></div></div></div>`}
function renderOrders(){const rows=orders.map(o=>`<tr><td>#${esc(o.id.slice(0,8))}</td><td>${esc(resellers.find(r=>r.id===o.resellerId)?.name||o.resellerName||"Unknown")}</td><td>${esc(o.customerName)}</td><td>${esc(o.phone)}</td><td>${esc(o.productName)} × ${o.qty||1}</td><td>${money(o.total)}</td><td><select onchange="changeStatus('${o.id}',this.value)">${["Pending","Confirmed","LORVEX Ordered","Shipped","Delivered","Cancelled"].map(s=>`<option value="${esc(s)}" ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${money(o.commission)}</td></tr>`).join("");$("orders").innerHTML=`<div class="panel-head"><div><h2>All Orders</h2><p class="muted">Review and update reseller orders.</p></div></div><div class="table-wrap">${rows?`<table><thead><tr><th>ID</th><th>Reseller</th><th>Customer</th><th>Phone</th><th>Product</th><th>Total</th><th>Status</th><th>Commission</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No orders yet.</div>`}</div>`}
window.changeStatus=async(id,status)=>{try{await db.collection("orders").doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast("Order status updated");await loadAdmin();showTab("orders")}catch(e){alert("Could not update order: "+e.message)}};
function renderProducts(){$("products").innerHTML=`<div class="panel-head"><div><h2>Products</h2><p class="muted">Manage catalogue prices and reseller commission.</p></div><button class="btn" onclick="productModal()">+ Add Product</button></div><div class="table-wrap">${products.length?`<table><thead><tr><th>Product</th><th>Cost</th><th>Sell</th><th>Commission</th><th>Status</th><th>Action</th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.commission)}</td><td><span class="pill ${p.active===false?"danger":"success"}">${p.active===false?"Inactive":"Active"}</span></td><td><div class="actions"><button class="btn sm secondary" onclick="editProduct('${p.id}')">Edit</button><button class="btn sm danger" onclick="removeProduct('${p.id}')">Delete</button></div></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No products yet. Add your first product.</div>`}</div>`}
window.productModal=()=>openModal(`<h2>Add Product</h2><p class="muted">Enter product information.</p><form id="productForm"><div class="field"><label>Product name</label><input name="name" required></div><div class="grid"><div class="field"><label>Cost (Rs.)</label><input name="cost" type="number" step=".01" min="0" required></div><div class="field"><label>Selling price (Rs.)</label><input name="price" type="number" step=".01" min="0" required></div></div><div class="field"><label>Reseller commission (Rs.)</label><input name="commission" type="number" step=".01" min="0" required></div><div class="field"><label>Image URL (optional)</label><input name="image" type="url"></div><button class="btn full">Add Product</button></form>`);
window.editProduct=async id=>{const p=products.find(x=>x.id===id);if(!p)return;openModal(`<h2>Edit Product</h2><form id="editProductForm"><input type="hidden" name="id" value="${esc(p.id)}"><div class="field"><label>Product name</label><input name="name" value="${esc(p.name)}" required></div><div class="grid"><div class="field"><label>Cost</label><input name="cost" type="number" step=".01" value="${Number(p.cost||0)}" required></div><div class="field"><label>Selling price</label><input name="price" type="number" step=".01" value="${Number(p.price||0)}" required></div></div><div class="field"><label>Commission</label><input name="commission" type="number" step=".01" value="${Number(p.commission||0)}" required></div><div class="field"><label>Status</label><select name="active"><option value="true" ${p.active!==false?"selected":""}>Active</option><option value="false" ${p.active===false?"selected":""}>Inactive</option></select></div><button class="btn full">Save Changes</button></form>`)};
window.removeProduct=async id=>{if(confirm("Delete this product?")){try{await db.collection("products").doc(id).delete();toast("Product deleted");await loadAdmin();showTab("products")}catch(e){alert("Could not delete product: "+e.message)}}};
function renderResellers(){$("resellers").innerHTML=`<div class="panel-head"><div><h2>Resellers</h2><p class="muted">Create and manage reseller accounts.</p></div><button class="btn" onclick="resellerModal()">+ Add Reseller</button></div><div class="table-wrap">${resellers.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody>${resellers.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.email)}</td><td>${esc(r.phone||"—")}</td><td><span class="pill ${r.active===false||r.status==="inactive"?"danger":"success"}">${r.active===false||r.status==="inactive"?"Inactive":"Active"}</span></td><td><button class="btn sm secondary" onclick="toggleReseller('${r.id}',${r.active!==false&&r.status!=="inactive"})">${r.active===false||r.status==="inactive"?"Activate":"Deactivate"}</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No reseller profiles yet.</div>`}</div>`}
window.toggleReseller=async(id,isActive)=>{try{await db.collection("users").doc(id).update({active:!isActive,status:!isActive?"active":"inactive"});toast(isActive?"Reseller deactivated":"Reseller activated");await loadAdmin();showTab("resellers")}catch(e){alert("Could not update reseller: "+e.message)}};
window.resellerModal=()=>openModal(`<h2>Create Reseller Account</h2><div class="notice">The password is stored by Firebase Authentication, not Firestore.</div><form id="resellerForm"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email / Login</label><input name="email" type="email" required></div><div class="field"><label>Temporary password</label><input name="password" type="password" minlength="6" required></div><div class="grid"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div><button class="btn full">Create Reseller</button></form>`);
function renderMyOverview(){const delivered=orders.filter(o=>o.status==="Delivered"),earnings=delivered.reduce((a,o)=>a+Number(o.commission||0),0),sales=orders.reduce((a,o)=>a+Number(o.total||0),0);$("myOverview").innerHTML=`<div class="panel-head"><div><h2>Welcome, ${esc(profile.name||"Reseller")}</h2><p class="muted">Create customer orders and track your earnings.</p></div><button class="btn" onclick="newOrderModal()">+ New Order</button></div><div class="stats"><div class="stat"><span class="label">MY ORDERS</span><b>${orders.length}</b></div><div class="stat"><span class="label">DELIVERED</span><b>${delivered.length}</b></div><div class="stat"><span class="label">PENDING</span><b>${orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length}</b></div><div class="stat"><span class="label">MY EARNINGS</span><b class="accent">${money(earnings)}</b></div></div><div class="info-card"><h3>Sales value</h3><b>${money(sales)}</b><p class="muted small">Earnings are counted from delivered orders only.</p></div>`}
function renderMyOrders(){const rows=orders.map(o=>`<tr><td>#${esc(o.id.slice(0,8))}</td><td>${esc(o.customerName)}</td><td>${esc(o.productName)}</td><td>${o.qty||1}</td><td>${money(o.total)}</td><td><span class="pill ${statusClass(o.status)}">${esc(o.status)}</span></td><td>${o.status==="Delivered"?money(o.commission):money(0)}</td></tr>`).join("");$("myOrders").innerHTML=`<div class="panel-head"><div><h2>My Orders</h2><p class="muted">Only your own orders are shown here.</p></div></div><div class="table-wrap">${rows?`<table><thead><tr><th>ID</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th><th>Commission</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No orders yet. Create your first order.</div>`}</div>`}
window.newOrderModal=()=>openModal(`<h2>New Customer Order</h2><form id="orderForm"><div class="field"><label>Product</label><select name="productId" required><option value="">Select product</option>${products.filter(p=>p.active!==false).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${money(p.price)}</option>`).join("")}</select></div><div class="grid"><div class="field"><label>Customer name</label><input name="customerName" required></div><div class="field"><label>Customer phone</label><input name="phone" required></div></div><div class="field"><label>Delivery address</label><textarea name="address" required></textarea></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn full">Submit Order</button></form>`);
document.addEventListener("submit",async e=>{if(e.target.id==="productForm"){e.preventDefault();try{const f=new FormData(e.target);await db.collection("products").add({name:f.get("name"),cost:+f.get("cost"),price:+f.get("price"),commission:+f.get("commission"),image:f.get("image")||"",active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal();toast("Product added");await loadAdmin();showTab("products")}catch(err){alert("Could not add product: "+err.message)}}
if(e.target.id==="editProductForm"){e.preventDefault();try{const f=new FormData(e.target);await db.collection("products").doc(f.get("id")).update({name:f.get("name"),cost:+f.get("cost"),price:+f.get("price"),commission:+f.get("commission"),active:f.get("active")==="true",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal();toast("Product updated");await loadAdmin();showTab("products")}catch(err){alert("Could not update product: "+err.message)}}
if(e.target.id==="resellerForm"){e.preventDefault();const f=new FormData(e.target),btn=e.submitter;btn.disabled=true;btn.textContent="Creating…";try{const email=f.get("email").trim(),password=f.get("password");const cred=await secondaryAuth.createUserWithEmailAndPassword(email,password);await db.collection("users").doc(cred.user.uid).set({name:f.get("name"),email,phone:f.get("phone")||"",role:"reseller",active:f.get("status")==="active",status:f.get("status"),createdAt:firebase.firestore.FieldValue.serverTimestamp()});await secondaryAuth.signOut();closeModal();toast("Reseller account created");await loadAdmin();showTab("resellers")}catch(err){try{await secondaryAuth.signOut()}catch(_){}alert("Could not create reseller: "+friendly(err))}finally{btn.disabled=false;btn.textContent="Create Reseller"}}
if(e.target.id==="orderForm"){e.preventDefault();try{const f=new FormData(e.target),p=products.find(x=>x.id===f.get("productId")),qty=+f.get("qty");if(!p)throw new Error("Select a product.");await db.collection("orders").add({resellerId:profile.uid,resellerName:profile.name,customerName:f.get("customerName"),phone:f.get("phone"),address:f.get("address"),notes:f.get("notes")||"",productId:p.id,productName:p.name,qty,total:p.price*qty,commission:p.commission*qty,status:"Pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal();toast("Order submitted");await loadReseller();showTab("myOrders")}catch(err){alert("Could not submit order: "+err.message)}}});
</script></body></html>
